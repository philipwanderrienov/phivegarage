services:
 db:
  image: postgres:16-alpine
  environment:
   POSTGRES_DB: phivegarage
   POSTGRES_USER: phivegarage
   POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
  volumes:
   - postgres_data:/var/lib/postgresql/data
  healthcheck:
   test: ["CMD-SHELL", "pg_isready -U phivegarage"]
   interval: 5s
   retries: 10
  restart: unless-stopped
 backend:
  build: ./backend
  environment:
   DATABASE_URL: jdbc:postgresql://db:5432/phivegarage
   DATABASE_USER: phivegarage
   DATABASE_PASSWORD: ${DATABASE_PASSWORD}
   APP_USERNAME: ${APP_USERNAME:-admin}
   APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
   OPENAI_API_KEY: ${OPENAI_API_KEY:-}
   OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
   STORAGE_PATH: /app/data
  volumes:
   - pdf_data:/app/data
  depends_on:
   db:
    condition: service_healthy
  restart: unless-stopped
 frontend:
  build: ./frontend
  ports:
   - "127.0.0.1:8090:80"
  depends_on:
   - backend
  restart: unless-stopped
volumes:
 postgres_data:
 pdf_data:
